name: Release Packer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create for the release, formatted YYYY-WW-N (ISO week, then a counter within that week)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip the project
        run: |
          zip -r projects.zip projects README.md

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: projects.zip
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: ${{ github.event_name == 'workflow_dispatch' }}
